services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/carrosdb
      DB_USER: postgres
      DB_PASSWORD: "123456"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    container_name: postgres-carros
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=carrosdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carrosdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
